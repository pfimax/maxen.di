# Builds the documentation site (guides plus the API reference taken from the XML comments) and publishes it to GitHub Pages.
# Pull requests get the build only, so a broken link or reference is caught before it reaches the live site.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "api/**"
      - "images/**"
      - "template/**"
      - "src/**"
      - "toc.yml"
      - "index.md"
      - "docfx.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "api/**"
      - "images/**"
      - "template/**"
      - "src/**"
      - "toc.yml"
      - "index.md"
      - "docfx.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch or pull request. Sharing a single group would let a pull request's build cancel a deploy from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install DocFX
        run: dotnet tool install --global docfx

      # Warnings (a broken link, an unknown xref) fail the build instead of shipping a page with a dead end.
      - name: Build the site
        run: docfx docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
