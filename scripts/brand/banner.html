<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maxen.DI banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; background: #0a0d12; }
  .banner { width: 1280px; height: 400px; box-sizing: border-box; padding: 56px 72px; display: flex; align-items: center; justify-content: space-between; gap: 48px; font-family: "Inter", "Segoe UI", sans-serif; color: #e6eaf0; background: #0a0d12; border-bottom: 1px solid #1f2733; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  h1 { margin: 28px 0 0; font-size: 50px; line-height: 1.06; letter-spacing: -0.03em; font-weight: 700; max-width: 600px; }
  p { margin: 20px 0 0; font-size: 22px; color: #9aa5b4; }
  .card { width: 480px; flex: none; background: #0f141a; border: 1px solid #222a35; border-radius: 14px; overflow: hidden; }
  .head { display: flex; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid #1b222c; font-size: 14px; color: #8b96a5; }
  .head b { font-family: "JetBrains Mono", monospace; font-weight: 500; color: #f5b84b; font-size: 13px; }
  pre { margin: 0; padding: 20px 18px; font-family: "JetBrains Mono", monospace; font-size: 15px; line-height: 1.75; color: #d5dbe5; }
  .c { color: #5c6877; } .k { color: #7cb7ff; } .t { color: #f2cc8f; }
  .sq { text-decoration: underline wavy #f5b84b; text-underline-offset: 5px; }
  .diag { padding: 14px 18px; border-top: 1px solid #1b222c; background: #141108; font-size: 15px; color: #d8cfa8; display: flex; gap: 14px; }
  .diag b { font-family: "JetBrains Mono", monospace; font-weight: 500; color: #f5b84b; }
</style>
</head>
<body>
<div class="banner">
  <div>
    <div class="brand">
      <svg width="52" height="52" viewBox="0 0 28 28" fill="none"><path d="M7 21V9l7 8 7-8v12" stroke="#7cf0b5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="7" r="2.4" fill="#7cf0b5"/><circle cx="21" cy="7" r="2.4" fill="#7cf0b5"/></svg>
      Maxen.DI
    </div>
    <h1>Know what is wrong before your users do.</h1>
    <p>A dependency injection container for .NET 8, 9 and 10.</p>
  </div>
  <div class="card">
    <div class="head"><span>Program.cs</span><b>1 warning</b></div>
<pre><span class="c">// Reads the signed-in user: one request.</span>
builder.<span class="k">Register</span>&lt;<span class="t">ReportService</span>&gt;()
       .<span class="sq">AsSingleton</span>();</pre>
    <div class="diag"><b>MAXEN005</b><span>A singleton cannot depend on a scoped service.</span></div>
  </div>
</div>
</body>
</html>
